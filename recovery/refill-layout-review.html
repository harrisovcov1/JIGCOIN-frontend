daily-perks\" id=\"dailyRewardPerks\"><\/p><p class=\"daily-next-unlock\" id=\"dailyNextUnlock\"><\/p>\n        <p class=\"daily-continuity\" id=\"dailyRewardSchedule\"><\/p>\n        <p class=\"daily-next-unlock\" id=\"dailyDoubleReward\"><\/p>\n      <\/section>\n      <div class=\"daily-calendar\" id=\"dailyRewardCalendar\" aria-label=\"Seven-day reward calendar\"><\/div>\n      <details class=\"daily-more\"><summary>Perks &amp; permanent unlocks<\/summary><p class=\"quest-info\" id=\"dailyRewardNextPerk\"><\/p><section class=\"daily-cosmetics\"><h3>Unlock once. Keep forever.<\/h3><div id=\"dailyCosmeticList\"><\/div><\/section><\/details>\n      <details class=\"daily-more quest-info\"><summary>Reward rules &amp; missed days<\/summary><p id=\"dailyRewardMilestones\"><\/p><p>Check in once per UTC day. Collected days show a tick; upcoming days show the current reward schedule. Earlier payouts stay yours. After a missed day, a free restart resets your streak benefits, but keeps your coins, ranks and unlocked cosmetics. Eligible Momentum Shields still work automatically.<\/p><\/details>\n      <label class=\"daily-reminder\"><input type=\"checkbox\" id=\"dailyReminder\"><span>Extra reminder before reset<small>One in-app reminder in the final two hours, only if still unclaimed. No Telegram messages.<\/small><\/span><\/label>\n      <button class=\"quest-action\" id=\"dailyPlayCollect\">Daily challenge &amp; Launch Edition \u203a<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"sheet\" id=\"homeQuestSheet\" role=\"dialog\" aria-labelledby=\"homeQuestTitle\">\n    <div class=\"sheet-header\"><div><div class=\"sheet-title\" id=\"homeQuestTitle\">Play &amp; collect<\/div><div class=\"sheet-subtitle\">Small goals. Coins worth collecting.<\/div><\/div><button class=\"sheet-close\" id=\"homeQuestClose\" aria-label=\"Back to Home\">\u00d7<\/button><\/div>\n    <div class=\"sheet-body\">\n      <div class=\"event-banner\" id=\"eventBanner\"><div class=\"event-row\"><div><div ext\">30-day pass<\/span><\/div>\n        <h2 id=\"vaultVipTitle\">Double your tap coins for 30 days.<\/h2>\n        <div class=\"vault-benefits\">\n          <div><span class=\"vault-benefit-icon\" aria-hidden=\"true\">2\u00d7<\/span><strong>Tap coins<\/strong><span id=\"vipTapValue\">2\u00d7 your usual tap rate<\/span><\/div>\n          <div><span class=\"vault-benefit-icon\" aria-hidden=\"true\">\u03df<\/span><strong>Energy capacity<\/strong><span id=\"vipEnergyValue\">2\u00d7 your usual capacity<\/span><\/div>\n        <\/div>\n        <p class=\"vault-vip-note\" id=\"vipPerksText\">Your personal comparison appears when Vault connects.<\/p>\n        <div class=\"pilot-coin-row\" id=\"pilotCoinRow\"><button id=\"pilotPreviewOpen\" type=\"button\" aria-haspopup=\"dialog\" aria-label=\"Preview Midnight Crown\"><span id=\"pilotCoinPreview\" aria-hidden=\"true\"><img class=\"midnight-coin\" src=\"./assets/midnight-crown.webp\" width=\"64\" height=\"64\" alt=\"\" draggable=\"false\"><\/span><span><strong>Midnight Crown<\/strong><small>Preview coin \u00b7 Home &amp; podium \u203a<\/small><\/span><\/button><button id=\"pilotCoinEquip\" class=\"vault-text-button\" hidden>Equip<\/button><\/div>\n        <div class=\"vault-vip-result\"><p class=\"vault-vip-earned\" id=\"vipBonusText\" hidden><\/p><p class=\"vault-expiry\" id=\"vipExpiryText\" hidden><\/p><\/div>\n        <div id=\"vipConsentPanel\" hidden><label class=\"vault-terms-consent\"><input type=\"checkbox\" id=\"vipTermsAccepted\"><span>I agree to the <button type=\"button\" class=\"vault-text-button\" id=\"vipTermsOpen\">VIP terms<\/button><\/span><\/label><\/div>\n        <button type=\"button\" class=\"vault-buy\" id=\"vipReview\" hidden>Review VIP \u00b7 500 Stars<\/button>\n        <button type=\"button\" class=\"vault-buy\" id=\"vipBuyBtn\" disabled>Loading VIP offer\u2026<\/button>\n        <p class=\"vault-payment-note\">One payment \u00b7 No auto-renewal<\/p>\n        <div class=\"vault-live-status\" role=\"status\" aria-live=\"polite\"><span id=\"vipFeedback\"><\/span><button type=\"button\" class=\"vault-text-button\" id=\"vipRetry\" hidden>Retry<\/button><\/div>\n      <\/section>\n      <div class=\"vault-utility\">\n        <details id=\"pilotMedals\"><summary>Weekly medals<\/summary><div id=\"pilotMedalList\">Play a weekly race to compete for a dated medal.<\/div><\/details>\n        <button type=\"button\" id=\"vaultHistoryOpen\">Purchase help <span aria-hidden=\"true\">\u203a<\/span><\/button>\n        <details id=\"vaultWithdrawalDetails\"><summary>Airdrop &amp; withdrawals <span aria-hidden=\"true\">+<\/span><\/summary><p>A JigCoin token airdrop is planned. Eligibility, allocations and conversion terms are awaiting publication. In-game coins currently have no cash-out value. VIP buys the game benefits shown above.<\/p><\/details>\n      <\/div>\n    <\/div>\n  <\/div>\n  <dialog id=\"purchaseReview\" aria-labelledby=\"purchaseReviewTitle\" aria-describedby=\"purchaseReviewItem purchaseReviewPrice\">\n    <h2 id=\"purchaseReviewTitle\">Review purchase<\/h2>\n    <p id=\"purchaseReviewItem\"><\/p>\n    <p id=\"purchaseReviewPrice\"><\/p>\n    <p>This purchase grants the in-game benefit shown. In-game coins have no cash-out value or guaranteed airdrop allocation.<\/p>\n    <p>For payment help or refunds, send /paysupport to the JigCoin bot with your order reference.<\/p>\n    <form method=\"dialog\">\n      <button type=\"submit\" value=\"cancel\" id=\"purchaseReviewCancel\" autofocus>Cancel<\/button>\n      <button type=\"submit\" value=\"agree\" class=\"pilot-primary\">Agree and continue<\/button>\n    <\/form>\n  <\/dialog>\n  <dialog id=\"tapSaveDialog\" aria-labelledby=\"tapSaveTitle\">\n    <h2 id=\"tapSaveTitle\">Tap saving<\/h2>\n    <p id=\"homeNormalSyncStatus\"><\/p>\n    <div id=\"tapSyncStatus\" class=\"tap-sync-status\" hidden><\/div>\n    <p id=\"historicalTapStatus\" hidden><\/p>\n    <p>Your balance shows whole coins. Fractional tap bonuses continue to accumulate.<\/p>\n    <form method=\"dialog\"><button type=\"submit\" class=\"quest-action\">Close<\/button><\/form>\n  <\/dialog>\n  <dialog id=\"streakMessageDialog\" aria-labelledby=\"streakMessageTitle\">\n    <h2 id=\"streakMessageTitle\">Telegram reminder<\/h2>\n    <p id=\"streakMessageTerms\">One message for your next daily reward, only if it is still unclaimed.<\/p>\n    <label id=\"streakMessageTimeField\" hidden>Local time <input id=\"streakMessageTime\" type=\"time\" value=\"19:00\" required><small id=\"streakMessageZone\"><\/small><\/label>\n    <p id=\"streakMessageStatus\" role=\"status\" aria-live=\"polite\"><\/p>\n    <div class=\"streak-message-actions\">\n      <button id=\"streakMessageSave\" type=\"button\" class=\"quest-action\" hidden>Set reminder<\/button>\n      <button id=\"streakMessageCancel\" type=\"button\" class=\"shop-retry\" hidden>Cancel reminder<\/button>\n      <button id=\"streakMessageRetry\" type=\"button\" class=\"shop-retry\" hidden>Check reminder<\/button>\n      <button id=\"streakMessageClose\" type=\"button\" class=\"shop-retry\" autofocus>Close<\/button>\n    <\/div>\n  <\/dialog>\n  <dialog id=\"crownPreview\" aria-labelledby=\"crownPreviewTitle\">\n    <div class=\"mint-cabinet-scene\"><span id=\"cabinetCoin\" aria-hidden=\"true\"><\/span><\/div>\n    <div class=\"mint-preview-heading\">\n      <button type=\"button\" data-browse-rank=\"previous\" aria-label=\"Preview previous rank finish\">\u2039<\/button>\n      <h2 id=\"crownPreviewTitle\" aria-live=\"polite\">Midnight Crown<\/h2>\n      <button type=\"button\" data-browse-rank=\"next\" aria-label=\"Preview next rank finish\">\u203a<\/button>\n    <\/div>\n    <p id=\"cabinetCaption\">Black enamel and gold laurel. Included with active VIP.<\/p>\n    <form method=\"dialog\"><button class=\"pilot-primary\" type=\"submit\">Close preview<\/button><\/form>\n  <\/dialog>\n  <dialog id=\"resultImage\" aria-labelledby=\"resultImageTitle\">\n    <h2 id=\"resultImageTitle\">Race card<\/h2><img id=\"raceCardImage\" alt=\"Saved race result with both players\u2019 coins and scores\">\n    <div class=\"race-image-actions\"><a id=\"raceCardDownload\" download=\"JigCoin-race.png\">Save PNG<\/a>\n    <form method=\"dialog\"><button type=\"submit\">Close<\/button><\/form><\/div>\n  <\/dialog>\n  <div class=\"sheet\" id=\"vaultDetailsSheet\" role=\"region\" aria-labelledby=\"vaultDetailsTitle\">\n    <div class=\"sheet-header\"><div><div class=\"sheet-title\" id=\"vaultDetailsTitle\">VIP terms &amp; purchases<\/div><div class=\"sheet-subtitle\">Your benefits, receipts and support.<\/div><\/div><button class=\"sheet-close\" id=\"vaultDetailsClose\" aria-label=\"Back to Vault\">\u00d7<\/button><\/div>\n    <div class=\"sheet-body vault-details\">\n      <section id=\"vipTerms\"><h2>VIP \u00b7 30 days \u00b7 500 Stars<\/h2><p>One payment, with no automatic renewal. Your 30 days start after confirmed payment. Renewals add 30 days after your existing VIP expiry.<\/p>\n      <ul><li>Twice your normal energy capacity, including active streak capacity bonuses. Regeneration speed stays the same; activation does not instantly fill the extra capacity.<\/li><li>Twice your normal tap coins, including active streak bonuses. The temporary 2\u00d7 ad boost stacks with VIP.<\/li><li>Joining, referral, daily and fixed ad rewards, and purchased coin packs, keep their stated amounts. VIP does not multiply your existing balance.<\/li><li>When VIP expires, normal capacity and tap rewards return. Earned coins stay in your account.<\/li><\/ul><p>Fractional tap coins accumulate until they make a whole coin. The VIP bonus total counts extra coins actually credited since this update.<\/p><p>VIP grants game benefits, not a cash return or guaranteed airdrop. For payment problems or refund requests, contact payment support below. A refunded pass loses its unused VIP time; separately purchased time and earned coins are preserved.<\/p><\/section>\n      <section><h2>VIP purchases<\/h2><div id=\"vipOrderHistory\">No purchase history loaded.<\/div><\/section>\n      <button type=\"button\" class=\"vault-details-link\" id=\"vipPacksBtn\">Coin pack purchase history \u203a<\/button>\n      <button type=\"button\" class=\"vault-details-link\" id=\"vaultPaySupport\">Payment help \u00b7 /paysupport \u203a<\/button>\n      <p class=\"hub-small\">App version 14<\/p><div id=\"hubOwnedShield\" hidden class=\"vip-box\"><strong>Momentum Shield<\/strong><p>One eligible shield covers one missed day and is consumed when used.<\/p><div id=\"momentumShieldStatus\"><\/div><div id=\"momentumShieldList\" hidden><\/div><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sheet\" id=\"boostSheet\" role=\"region\" aria-labelledby=\"boostSheetTitle\">\n    <div class=\"sheet-header\">\n      <div><div class=\"sheet-title\" id=\"boostSheetTitle\" tabindex=\"-1\">Rewards<\/div>\n        <div class=\"sheet-subtitle\">Daily streaks and free challenges.<\/div><\/div>\n      <button class=\"sheet-close\" id=\"boostClose\" aria-label=\"Back to Home\">\u00d7<\/button>\n    <\/div>\n    <div class=\"sheet-body\">\n      <p class=\"sr-only\" id=\"boostRecommendation\" aria-live=\"polite\">Choose your next reward.<\/p>\n      <div id=\"rewardChoices\">\n      <article class=\"boost-card boost-streak\" id=\"rewardsDailyCard\">\n        <div class=\"boost-card-top\"><span class=\"boost-icon\" aria-hidden=\"true\">\u2713<\/span><h3>Daily streak <span id=\"rewardsDailyAmount\"><\/span><\/h3><\/div>\n        <div class=\"boost-state\" id=\"rewardsDailyStatus\" role=\"status\">Checking your daily reward\u2026<\/div>\n        <button type=\"button\" class=\"boost-action\" id=\"rewardsDailyAction\" disabled>Checking\u2026<\/button>\n        <div id=\"rewardWeekStrip\" hidden aria-label=\"Streak calendar\"><\/div>\n        <button id=\"rewardsTelegramReminder\" class=\"reminder-link\" type=\"button\" aria-haspopup=\"dialog\" hidden>Remind me tomorrow<\/button>\n      <\/article>\n      <article hidden class=\"boost-card boost-coins\" data-boost-code=\"sp_visit_partner\">\n        <div class=\"boost-card-top\"><span class=\"boost-icon\" aria-hidden=\"true\">J<\/span><h3>Get coins <span id=\"coinRewardAmount\">+200<\/span><\/h3><\/div>\n        <div class=\"boost-state\" id=\"coinRewardStatus\" role=\"status\">Checking availability\u2026<\/div>\n        <button type=\"button\" class=\"boost-action\" id=\"coinRewardAction\" disabled>Checking\u2026<\/button>\n        <button type=\"button\" class=\"reward-upgrade\" id=\"rewardCoinPacks\" hidden>See coin packs<\/button>\n      <\/article>\n      <article hidden class=\"boost-card\" data-boost-code=\"sp_emergency_energy\">\n        <div class=\"boost-card-top\"><span class=\"boost-icon\" aria-hidden=\"true\">\u26a1<\/span><h3>Refill energy<\/h3><\/div>\n        <div class=\"boost-state\" id=\"energyBoostStatus\" role=\"status\">Checking availability\u2026<\/div>\n        <button type=\"button\" class=\"boost-action\" id=\"energyBoostAction\" disabled>Checking\u2026<\/button>\n        <button type=\"button\" class=\"reward-upgrade\" id=\"rewardRefillVip\" hidden>See VIP<\/button>\n      <\/article>\n      <article hidden class=\"boost-card boost-double\" data-boost-code=\"sp_double_points\">\n        <div class=\"boost-card-top\"><span class=\"boost-icon\" aria-hidden=\"true\">2\u00d7<\/span><h3>Double tap coins<\/h3><\/div>\n        <div class=\"boost-state\" id=\"doubleBoostStatus\" role=\"status\">Checking availability\u2026<\/div>\n        <button type=\"button\" class=\"boost-action\" id=\"doubleBoostAction\" disabled>Checking\u2026<\/button>\n        <button type=\"button\" class=\"reward-upgrade\" id=\"rewardBoostVip\" hidden>See VIP<\/button>\n      <\/article>\n      <\/div>\n      <article id=\"rewardsCollectionCard\" class=\"reward-collection\" aria-labelledby=\"rewardsCollectionTitle\" hidden>\n        <span id=\"rewardsCollectionArt\" class=\"reward-collection-art\" aria-hidden=\"true\"><\/span>\n        <div class=\"reward-collection-copy\"><small id=\"rewardsCollectionEyebrow\">Next coin finish<\/small><h3 id=\"rewardsCollectionTitle\">Loading your collection\u2026<\/h3><p id=\"rewardsCollectionProgress\">Your saved progress appears after sync.<\/p><\/div>\n        <progress id=\"rewardsCollectionMeter\" max=\"1\" value=\"0\" aria-label=\"Progress to next coin finish\"><\/progress>\n        <button id=\"rewardsCollectionAction\" type=\"button\" class=\"reward-collection-action\" aria-haspopup=\"dialog\" disabled>Preview finish \u203a<\/button>\n      <\/article>\n      <p class=\"boost-footnote\" id=\"boostCooldownNote\">Daily streak is free. Optional ad rewards unlock after confirmation.<\/p>\n      <details id=\"boostHelp\" class=\"reward-ad-help\" hidden><summary>Advert help<\/summary><p id=\"boostHelpText\"><\/p><\/details>\n      <div class=\"pilot-free-activities\">\n        <button type=\"button\" id=\"pilotDailyChallenge\" class=\"pilot-link\" disabled><progress id=\"pilotChallengeMeter\" hidden aria-label=\"Today\u2019s confirmed taps\" max=\"100\" value=\"0\"><\/progress><strong>100-tap challenge<\/strong><small id=\"pilotDailyProgress\">Reach 100 taps today<\/small><span id=\"pilotChallengeAction\">Checking\u2026<\/span><\/button>\n        <button type=\"button\" data-open-weekly class=\"pilot-link\"><i class=\"activity-medal\" aria-hidden=\"true\">\u2726<\/i><strong>Weekly friend race<\/strong><small>3 free runs \u00b7 45s each<\/small><span>Race for gold \u203a<\/span><\/button>\n      <\/div>\n      <div class=\"reward-footer\">\n        <button type=\"button\" class=\"quest-action\" id=\"rewardsReturn\" hidden>Back to tapping<\/button>\n        <button type=\"button\" class=\"shop-retry\" id=\"boostRefresh\" hidden>Check again<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- Coin Shop (private Telegram Stars pilot) -->\n  <div class=\"sheet\" id=\"coinShopSheet\">\n    <div class=\"sheet-header\">\n      <div>\n        <div class=\"sheet-title\">Coin Shop<\/div>\n        <div class=\"sheet-subtitle\">Coin packs \u00b7 pay with Telegram Stars<\/div>\n      <\/div>\n      <button class=\"sheet-close\" id=\"coinShopClose\" aria-label=\"Close Coin Shop\">\u00d7<\/button>\n    <\/div>\n    <div class=\"sheet-body\">\n      <div id=\"hubStarter\" hidden><\/div>\n      <div id=\"coinPackList\" aria-label=\"Coin packs\" aria-live=\"polite\" aria-busy=\"true\"><\/div>\n      <div id=\"hubCatalogStatus\" class=\"hub-catalog-status\" role=\"status\" hidden><\/div>\n      <button type=\"button\" class=\"shop-vip-pass\" id=\"shopVipPass\">\n        <img class=\"midnight-coin\" src=\"./assets/midnight-crown.webp\" alt=\"\" width=\"80\" height=\"80\">\n        <span><strong>Midnight Crown<\/strong><small>30-day VIP \u00b7 Double tap coins and energy capacity<\/small><\/span>\n        <span class=\"pass-chevron\" aria-hidden=\"true\">\u203a<\/span>\n      <\/button>\n      <details class=\"hub-history\" id=\"hubOrderDetails\">\n        <summary>Orders &amp; payment help<\/summary>\n        <p id=\"hubOrderNotice\" class=\"hub-small\" tabindex=\"-1\" hidden><\/p>\n        <p class=\"hub-small\">Packs add in-game coins to your balance after payment confirmation. Pay with Telegram Stars.<\/p>\n        <p class=\"hub-small\">In-game coins have no cash value. Buying a pack does not guarantee an airdrop allocation or future value.<\/p>\n        <div id=\"hubOrderHistory\"><\/div>\n        <p id=\"hubSupport\" class=\"hub-small\"><\/p><p class=\"hub-small\">App version 14<\/p>\n      <\/details>\n      <p id=\"hubShopNotice\" class=\"hub-small\" role=\"status\">In-game coins \u00b7 Telegram Stars<\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"toast\" id=\"toast\">\n    <span class=\"toast-icon\">\u2728<\/span>\n    <span id=\"toastText\">Saved<\/span>\n  <\/div>\n\n  <!-- SCRIPT STARTS IN PART 2 -->\n  \n\n\n\n\n\n\n\n\n\n\n\n\n\n<script>\nconst el=id=>document.getElementById(id);\nconst text=(id,value)=>{el(id).textContent=value;};\nconst show=(id,visible)=>{el(id).hidden=!visible;};\nconst coin=asset=>'<img class=\"mint-finish-coin\" src=\"./assets/'+asset+'.webp\" width=\"224\" height=\"224\" alt=\"\" draggable=\"false\">';\ndocument.documentElement.dataset.mintRank='1';\nel('accountContent').removeAttribute('inert');\nel('homeCoinWrap').dataset.loading='false';el('homeNextPreview').dataset.loading='false';el('mintPressCard').dataset.finish='rank-1';\nel('homeCoinArtwork').innerHTML=coin('foundry-gold');el('homeNextCoin').innerHTML=coin('aurora-glass');\ntext('rankName','Grinder');text('balanceText','20,000');text('globalRankValue','#2 of 142');text('homeRace','11,879 coins to pass #1    \u203a');text('mintFinishName','Foundry Gold');text('perTap','+1.05');text('todayText','1,500');\ntext('homeGoal','30,000 coins to Operator');text('homeGoalCaption','Aurora Glass \u00b7 Preview \u203a');text('homeDailyTitle','\u2713 Day 4 collected');text('hubDailyProgress','Tomorrow 500 coins');\nel('tapBtn').disabled=false;el('tapBtn').setAttribute('aria-busy','false');el('homeBoostAction').disabled=false;\nel('rewardsDailyCard').dataset.claimed='true';text('rewardsDailyAmount','Collected \u2713');el('rewardsDailyStatus').innerHTML='Day 4 \u00b7 Tomorrow 500 coins<span class=\"streak-benefit-preview\">Day 7: Momentum aura<\/span>';text('rewardsDailyAction','Calendar & perks');el('rewardsDailyAction').disabled=false;\nel('rewardWeekStrip').innerHTML=Array.from({length:7},(_,i)=>'<span class=\"daily-marker\" data-claimed=\"'+(i<4)+'\" data-focus=\"'+(i===3)+'\">'+(i+1)+(i<4?' \u2713':'')+'<\/span>').join('');show('rewardWeekStrip',true);show('rewardsTelegramReminder',true);\nel('rewardsCollectionArt').innerHTML=coin('aurora-glass');text('rewardsCollectionTitle','Aurora Glass');text('rewardsCollectionProgress','Operator \u00b7 30,000 coins to go');el('rewardsCollectionMeter').value=.25;el('rewardsCollectionAction').disabled=false;\nshow('rewardsReturn',true);show('pilotChallengeMeter',true);el('pilotChallengeMeter').value=100;el('pilotDailyChallenge').dataset.state='collected';text('pilotDailyProgress','100 / 100 taps today');text('pilotChallengeAction','Collected \u2713');\nfunction renderFixture(data){\n const home=data.panel==='home';\n const energy=data.energy??10;\n el('boostSheet').classList.toggle('show',!home);el('mainScroll').inert=!home;\n el('tabFarm').classList.toggle('active',home);el('tabTasks').classList.toggle('active',!home);\n el('tabFarm').setAttribute('aria-current',home?'page':'false');el('tabTasks').setAttribute('aria-current',home?'false':'page');\n text('energyText',energy+' / 55');text('energyLabel',energy===0?'Energy +1 in 1s':'Energy');el('energyFill').style.transform='scaleX('+(energy/55)+')';el('energyFill').dataset.low=String(energy<=11);\n show('homeRefillOpen',energy<=11);el('homeRefillOpen').disabled=energy>11;el('homeRefillOpen').dataset.state=data.state==='cooldown'?'waiting':'ready';text('homeRefillState',data.state==='cooldown'?'In 2m 46s':'Ad ready');el('homeRefillOpen').setAttribute('aria-label','Refill energy. '+(data.state==='cooldown'?'Available in 2m 46s.':'Watch ad to refill.')+' Open Rewards for details.');text('homeBoostAction',energy<=11?'Refill energy \u00b7 ad':'Weekly race');\n const preview=data.state==='preview';\n const card=document.querySelector('[data-boost-code=\"sp_emergency_energy\"]');card.hidden=preview;show('rewardsCollectionCard',preview);show('rewardRefillVip',false);show('boostHelp',false);\n text('boostCooldownNote','Energy refills automatically while you play or take a break.');\n const states={cooldown:['Cooldown \u00b7 5 minutes','Available in 2m 46s'],ready:['+50 energy now \u00b7 Fill to 55 \u00b7 Every 5 minutes. Optional advert; energy also refills automatically.','Watch ad to refill'],preparing:['','Preparing refill\u2026'],claimable:['Your confirmed refill is ready.','Claim refill'],error:['No advert is ready. You can check availability again after this short wait.','Try again in 37s']};\n const status=states[data.state]||states.cooldown;text('energyBoostStatus',status[0]);text('energyBoostAction',status[1]);el('energyBoostAction').disabled=!['ready','claimable'].includes(data.state);\n card.dataset.selected=String(data.state==='ready');card.classList.toggle('boost-recommended',data.state==='ready');\n if(data.state==='preparing'){show('rewardRefillVip',true);text('rewardRefillVip','VIP \u00b7 2\u00d7 capacity \u00b7 500 Stars / 30 days');text('boostCooldownNote','Preparing your optional refill\u2026');}\n if(data.state==='error'){show('boostHelp',true);text('boostHelpText','No advert is available right now. Energy keeps refilling.');text('boostCooldownNote','No advert is ready right now. Energy keeps refilling; you can check availability again shortly.');}\n el('boostSheet').querySelector('.sheet-body').scrollTop=0;\n}\nwindow.addEventListener('message',e=>{if(e.data?.fixture)renderFixture(e.data);});\nel('homeRefillOpen').onclick=()=>renderFixture({panel:'rewards',state:'ready',energy:10});\nel('rewardsReturn').onclick=()=>renderFixture({panel:'home',state:'ready',energy:10});\n<\/script><\/body>\n<\/html>\n";
const frames=[...document.querySelectorAll('iframe')];function update(){const [w,h]=document.getElementById('size').value.split(',');for(const f of frames){f.style.width=w+'px';f.style.height=h+'px';f.contentWindow.postMessage({fixture:true,panel:f.id==='home'?'home':'rewards',state:f.id==='preview'?'preview':document.getElementById('state').value,energy:Number(document.getElementById('energy').value)},'*');}}for(const f of frames){f.onload=update;f.srcdoc=source;}document.querySelectorAll('select').forEach(e=>e.onchange=update);</script></body></html>
