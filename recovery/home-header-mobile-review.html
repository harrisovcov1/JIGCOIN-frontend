<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home header mobile review — synthetic</title><style>
*{box-sizing:border-box}body{margin:0;background:#11151a;color:#eee9dd;font:14px/1.4 system-ui,sans-serif}main{padding:18px;max-width:1300px;margin:auto}h1{font-size:21px;margin:0 0 5px}p{margin:5px 0 14px;color:#b9c2cb}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px}select,button{font:inherit;min-height:40px;padding:6px 10px;border:1px solid #667482;background:#252e38;color:#f4f1e9;border-radius:6px}.stage{display:flex;gap:22px;align-items:flex-start;margin-top:18px;overflow:auto}iframe{display:block;flex:none;background:#111;border:1px solid #667482;width:390px;height:746px;border-radius:0}pre{font-size:12px;white-space:pre-wrap;max-width:580px;margin:0;overflow-wrap:anywhere}aside{min-width:240px}.status{color:#e3c795;font-weight:600}</style></head><body><main><h1>Home header mobile review</h1><p>Synthetic states with the current header controllers. External scripts and API calls are blocked. This does not verify real adverts, Telegram sessions or purchases.</p><div class="controls"><label>Viewport<select id="viewport"><option value="320,568">320 × 568</option><option value="390,746" selected>390 × 746</option><option value="430,832">430 × 832</option></select></label><label>Header state<select id="state"><option value="normal">Normal — Grinder</option><option value="long">Long rank — JigCoin Legend</option><option value="ready">Prepared refill advert</option><option value="claim">Confirmed refill claim</option><option value="cooldown">Successful refill cooldown</option><option value="no-fill">No-fill retry wait</option><option value="offline">Offline</option><option value="connecting">Connecting</option><option value="sync">Tap sync warning</option></select></label><button id="report">Check layout</button></div><div class="stage"><iframe id="phone" title="Synthetic JigCoin mobile preview" src="./home-header-review.html?case=normal"></iframe><aside><p class="status" id="summary">Loading synthetic preview…</p><pre id="details"></pre></aside></div></main><script>
const phone=document.getElementById('phone'),view=document.getElementById('viewport'),state=document.getElementById('state');
view.onchange=()=>{const [w,h]=view.value.split(',');phone.style.width=w+'px';phone.style.height=h+'px'};
state.onchange=()=>phone.contentWindow.postMessage({type:'jigcoin-home-fixture-case',case:state.value},location.origin);
document.getElementById('report').onclick=()=>phone.contentWindow.postMessage({type:'jigcoin-home-fixture-report'},location.origin);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='jigcoin-home-fixture')return;const r=e.data.report;document.getElementById('summary').textContent=r.case+' · '+r.focus+' · '+(r.overlap?'CONTROLS OVERLAP':r.horizontalOverflow?'PAGE OVERFLOWS':'No header overlap or page overflow');document.getElementById('details').textContent=JSON.stringify(r,null,2)});
</script></body></html>
